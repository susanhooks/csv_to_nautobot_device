---
sync_devices:
  pre_processor:
      set_env:
        commands:
          - command: "environment prompt {host}#"
            parser: "none"
            jpath: "*"
  hostname: 
    commands:
      - command: "show version | as json"
        parser: "none"
        jpath: '"basic system info"."Hostname"'
  serial: 
    commands:
      - command: "show version | as json"
        parser: "none"
        jpath: '"basic system info"."Serial Number"'
  device_type:
    commands:
      - command: "show version | as json"
        parser: "none"
        jpath: '"basic system info"."Chassis Type"'
  mgmt_interface:
    commands:
      - command: "show interface all | as json"
        parser: "none"
        jpath: "interfaces[*].subinterfaces[?address[?contains(prefix, '{{ obj }}')]][].name"
  mask_length:
    commands:
      - command: "show interface all | as json"
        parser: "none"
        jpath: "interfaces[*].subinterfaces[?address[?contains(prefix, '{{ obj }}')]].address[0][].prefix"
        post_processor: "{% if '/' in obj[0] %}{{ obj[0].split('/')[1] }}{% else %}31{% endif %}"
        iterable_type: "int"


